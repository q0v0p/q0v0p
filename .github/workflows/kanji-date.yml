name: Today Kanji

# 毎日 0:05 (日本時間) に今日の日付を毛筆で書く SVG を fude (https://github.com/q0v0p/fude) で作り、
# output ブランチへ置く。README は output ブランチの today-sumi.svg を表示する。
on:
  schedule:
    - cron: "5 15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/kanji-date.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: kanji-date
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: q0v0p/fude@v1
        with:
          theme: sumi
          output: dist/today-sumi.svg

      - name: Publish to output branch
        working-directory: dist
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add today-sumi.svg
          git commit -q -m "Today Kanji $(TZ=Asia/Tokyo date +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output

      # 公開リポジトリの schedule は 60 日動きがないと止まるので、毎回有効化し直しておく
      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable kanji-date.yml --repo "${{ github.repository }}"
